  <!-- Heartbeat pulse -->
  <path d="M10 31 L19 31 L23 17 L27 44 L31 24 L35 35 L49 35" fill="none" stroke="white" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
