<svg xmlns="http://www.w3.org/2000/svg" width="320" height="60" viewBox="0 0 320 60">
  <!-- Icon container -->
  <rect x="0" y="0" width="60" height="60" rx="14" fill="#3B5BDB"/>
  <!-- Meridian arc -->
  <path d="M12 40 Q30 7 48 40" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" opacity="0.5"/>
