  <!-- Wordmark -->
  <text x="76" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700" fill="white" letter-spacing="-0.5">Meridix</text>
  <text x="207" y="38" font-family="system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="26" font-weight="700" fill="#93C5FD" letter-spacing="-0.5">Labs</text>
