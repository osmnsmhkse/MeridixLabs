name: Secret scan

# Runs gitleaks on every push and pull request to catch accidentally
# committed secrets (API keys, tokens, the Supabase service-role key, etc.).
# History is clean today — this keeps it that way.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # GITLEAKS_LICENSE is only required for GitHub *organizations*.
          # For a personal/individual repo this scan runs without a license.
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
